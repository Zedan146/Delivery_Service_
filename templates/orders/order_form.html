{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2>{{ title }}</h2>
    </div>
    <div class="col text-end">
        <a href="{% url 'orders:order_list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Назад к списку
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const clientSelect = document.getElementById('id_client');
    const addressSelect = document.getElementById('id_delivery_address');

    function updateAddresses() {
        const clientId = clientSelect.value;
        if (clientId) {
            fetch(`/orders/get-client-addresses/?client_id=${clientId}`)
                .then(response => response.json())
                .then(data => {
                    addressSelect.innerHTML = '';
                    data.forEach(addr => {
                        const option = document.createElement('option');
                        option.value = addr.id;
                        option.textContent = addr.address;
                        addressSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error:', error));
        } else {
            addressSelect.innerHTML = '';
        }
    }

    clientSelect.addEventListener('change', updateAddresses);
    
    // Загружаем адреса при загрузке страницы, если клиент уже выбран
    if (clientSelect.value) {
        updateAddresses();
    }
});
</script>
{% endblock %}

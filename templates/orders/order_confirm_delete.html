{% extends "base.html" %}

{% block title %}Удаление заказа{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Подтверждение удаления заказа</h2>
                </div>
                <div class="card-body">
                    <p>Вы действительно хотите удалить заказ <strong>#{{ order.order_number }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'orders:order_detail' order.pk %}" class="btn btn-secondary me-2">
                            <i class="fas fa-times"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Удалить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

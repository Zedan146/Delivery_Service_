{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Редактирование профиля</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3 text-center">
                        {% if user.avatar %}
                            <img src="{{ user.avatar.url }}" alt="avatar" class="rounded-circle" style="width: 96px; height: 96px; object-fit: cover;">
                        {% else %}
                            <span class="d-inline-block rounded-circle bg-secondary text-white" style="width: 96px; height: 96px; line-height: 96px; font-size: 2.5rem;">
                                <i class="fas fa-user"></i>
                            </span>
                        {% endif %}
                    </div>
                    {{ form|crispy }}
                    <div class="text-end">
                        <a href="{% url 'users:profile' %}" class="btn btn-secondary me-2">Отмена</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
